steps:
  # Validate code and infrastructure before building deployable images.
  - name: 'python:3.11-slim'
    id: 'python-compile-check'
    entrypoint: python
    args:
      - '-m'
      - 'py_compile'
      - 'scripts/extract_training_frames.py'
      - 'scripts/split_yolo_dataset.py'
      - 'scripts/train_nhai_yolo.py'
      - 'scripts/build_yolo_test_subset.py'
      - 'scripts/evaluate_nhai_yolo.py'
      - 'services/video-validator/main.py'
      - 'services/frame-extractor/main.py'
      - 'services/telemetry-extractor/main.py'
      - 'services/dashboard-api/main.py'
      - 'services/data-processor/main.py'
      - 'services/report-generator/main.py'
      - 'services/ai-inference/main.py'

  - name: 'node:22'
    id: 'frontend-lint-build'
    entrypoint: bash
    args:
      - '-c'
      - 'cd services/dashboard-frontend && npm ci && npm run lint && npm run build'

  - name: 'hashicorp/terraform:1.15.3'
    id: 'terraform-validate'
    entrypoint: sh
    args:
      - '-c'
      - 'terraform -chdir=terraform init -backend=false && terraform -chdir=terraform fmt -check -recursive && terraform -chdir=terraform validate'

  # Build and push service images.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-telemetry-extractor'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/telemetry-extractor', './services/telemetry-extractor']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-telemetry-extractor'
    args: ['push', 'gcr.io/$PROJECT_ID/telemetry-extractor']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-video-validator'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/video-validator', './services/video-validator']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-video-validator'
    args: ['push', 'gcr.io/$PROJECT_ID/video-validator']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frame-extractor'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/frame-extractor', './services/frame-extractor']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frame-extractor'
    args: ['push', 'gcr.io/$PROJECT_ID/frame-extractor']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-inference'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ai-inference', './services/ai-inference']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-ai-inference'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-inference']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-data-processor'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/data-processor', './services/data-processor']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-data-processor'
    args: ['push', 'gcr.io/$PROJECT_ID/data-processor']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dashboard-api'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dashboard-api', './services/dashboard-api']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dashboard-api'
    args: ['push', 'gcr.io/$PROJECT_ID/dashboard-api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-report-generator'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/report-generator', './services/report-generator']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-report-generator'
    args: ['push', 'gcr.io/$PROJECT_ID/report-generator']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dashboard-frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dashboard-frontend', './services/dashboard-frontend']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dashboard-frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/dashboard-frontend']

  # Deploy Cloud Run services with production runtime config.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dashboard-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dashboard-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dashboard-api'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:asia-south1:nhai-das-postgres'
      - '--vpc-connector'
      - 'nhai-das-connector'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--set-env-vars'
      - 'DB_USER=postgres,DB_NAME=nhaidb,DB_HOST=/cloudsql/$PROJECT_ID:asia-south1:nhai-das-postgres,RAW_BUCKET=nhai-das-dev-raw-video,VALIDATED_BUCKET=nhai-das-dev-validated-video,QUARANTINE_BUCKET=nhai-das-dev-quarantine,PROCESSED_BUCKET=nhai-das-dev-processed,GCP_PROJECT=$PROJECT_ID,GCP_REGION=asia-south1,WORKFLOW_NAME=nhai-das-pipeline,MAX_PIPELINE_ACTIVE_SECONDS=3600,MAX_STAGE_IDLE_SECONDS=900'
      - '--set-secrets'
      - 'DB_PASSWORD=nhai-das-dev-db-password:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dashboard-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dashboard-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dashboard-frontend'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-telemetry-extractor'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'telemetry-extractor'
      - '--image'
      - 'gcr.io/$PROJECT_ID/telemetry-extractor'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'PROCESSED_BUCKET=nhai-das-dev-processed,YOLO_MODEL_NAMES=yolov8n.pt'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-video-validator'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'video-validator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/video-validator'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'VALIDATED_BUCKET=nhai-das-dev-validated-video,QUARANTINE_BUCKET=nhai-das-dev-quarantine,GCP_PROJECT=$PROJECT_ID,GCP_REGION=asia-south1,WORKFLOW_NAME=nhai-das-pipeline'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frame-extractor'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frame-extractor'
      - '--image'
      - 'gcr.io/$PROJECT_ID/frame-extractor'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'PROCESSED_BUCKET=nhai-das-dev-processed'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ai-inference'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-inference'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-inference'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'PROCESSED_BUCKET=nhai-das-dev-processed'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-data-processor'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'data-processor'
      - '--image'
      - 'gcr.io/$PROJECT_ID/data-processor'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:asia-south1:nhai-das-postgres'
      - '--vpc-connector'
      - 'nhai-das-connector'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--set-env-vars'
      - 'DB_USER=postgres,DB_NAME=nhaidb,DB_HOST=/cloudsql/$PROJECT_ID:asia-south1:nhai-das-postgres'
      - '--set-secrets'
      - 'DB_PASSWORD=nhai-das-dev-db-password:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-report-generator'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'report-generator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/report-generator'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:asia-south1:nhai-das-postgres'
      - '--vpc-connector'
      - 'nhai-das-connector'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--set-env-vars'
      - 'DB_USER=postgres,DB_NAME=nhaidb,DB_HOST=/cloudsql/$PROJECT_ID:asia-south1:nhai-das-postgres,PROCESSED_BUCKET=nhai-das-dev-processed'
      - '--set-secrets'
      - 'DB_PASSWORD=nhai-das-dev-db-password:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-workflow'
    entrypoint: gcloud
    args:
      - 'workflows'
      - 'deploy'
      - 'nhai-das-pipeline'
      - '--source'
      - 'services/workflow/workflow.yaml'
      - '--location'
      - 'asia-south1'
      - '--service-account'
      - 'nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'ensure-gcs-upload-dlq'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail

        REGION=asia-south1
        RAW_BUCKET=nhai-das-dev-raw-video
        UPLOAD_TOPIC=nhai-das-dev-gcs-upload-events
        UPLOAD_SUB=nhai-das-dev-gcs-upload-validator-sub
        DLQ_TOPIC=nhai-das-dev-dlq
        DLQ_SUB=nhai-das-dev-dlq-sub
        RUN_SA=nhai-das-dev-run-sa@$PROJECT_ID.iam.gserviceaccount.com
        PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
        PUBSUB_SA=service-$PROJECT_NUMBER@gcp-sa-pubsub.iam.gserviceaccount.com
        VALIDATOR_URL=$(gcloud run services describe video-validator --region="$REGION" --format='value(status.url)')

        if [ -z "$VALIDATOR_URL" ]; then
          echo "video-validator Cloud Run service URL is empty; cannot create Pub/Sub push subscription." >&2
          exit 1
        fi

        if gcloud eventarc triggers describe nhai-das-dev-gcs-upload --location="$REGION" >/dev/null 2>&1; then
          echo "Removing legacy Eventarc trigger so upload events are delivered through the Pub/Sub DLQ subscription."
          gcloud eventarc triggers delete nhai-das-dev-gcs-upload --location="$REGION" --quiet
        fi

        gcloud pubsub topics describe "$UPLOAD_TOPIC" >/dev/null 2>&1 || \
          gcloud pubsub topics create "$UPLOAD_TOPIC"

        gcloud pubsub topics describe "$DLQ_TOPIC" >/dev/null 2>&1 || \
          gcloud pubsub topics create "$DLQ_TOPIC"

        gcloud pubsub topics add-iam-policy-binding "$DLQ_TOPIC" \
          --member="serviceAccount:$PUBSUB_SA" \
          --role=roles/pubsub.publisher >/dev/null

        if ! gcloud pubsub subscriptions describe "$DLQ_SUB" >/dev/null 2>&1; then
          gcloud pubsub subscriptions create "$DLQ_SUB" --topic="$DLQ_TOPIC"
        fi

        if ! gcloud pubsub subscriptions describe "$UPLOAD_SUB" >/dev/null 2>&1; then
          gcloud pubsub subscriptions create "$UPLOAD_SUB" \
            --topic="$UPLOAD_TOPIC" \
            --push-endpoint="$VALIDATOR_URL/" \
            --push-auth-service-account="$RUN_SA" \
            --push-auth-token-audience="$VALIDATOR_URL/" \
            --ack-deadline=60 \
            --min-retry-delay=10s \
            --max-retry-delay=600s
        fi

        gcloud pubsub subscriptions add-iam-policy-binding "$UPLOAD_SUB" \
          --member="serviceAccount:$PUBSUB_SA" \
          --role=roles/pubsub.subscriber >/dev/null

        gcloud pubsub subscriptions update "$UPLOAD_SUB" \
          --push-endpoint="$VALIDATOR_URL/" \
          --push-auth-service-account="$RUN_SA" \
          --push-auth-token-audience="$VALIDATOR_URL/" \
          --dead-letter-topic="$DLQ_TOPIC" \
          --max-delivery-attempts=5 \
          --min-retry-delay=10s \
          --max-retry-delay=600s

        if ! gsutil notification list "gs://$RAW_BUCKET" | grep -F "$UPLOAD_TOPIC" >/dev/null; then
          gsutil notification create \
            -t "$UPLOAD_TOPIC" \
            -f json \
            -e OBJECT_FINALIZE \
            "gs://$RAW_BUCKET"
        fi

images:
  - 'gcr.io/$PROJECT_ID/telemetry-extractor'
  - 'gcr.io/$PROJECT_ID/video-validator'
  - 'gcr.io/$PROJECT_ID/frame-extractor'
  - 'gcr.io/$PROJECT_ID/ai-inference'
  - 'gcr.io/$PROJECT_ID/data-processor'
  - 'gcr.io/$PROJECT_ID/dashboard-api'
  - 'gcr.io/$PROJECT_ID/report-generator'
  - 'gcr.io/$PROJECT_ID/dashboard-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
